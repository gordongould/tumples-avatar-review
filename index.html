<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tumples V23 — Review Board</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3/dist/model-viewer.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #0a0a0f; color: #d0d0d8; line-height: 1.5; }
.container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
header { text-align: center; margin-bottom: 2rem; border-bottom: 1px solid #222; padding-bottom: 1rem; }
h1 { font-size: 1.5rem; color: #e8e8f0; }
.subtitle { color: #888; font-size: 0.9rem; margin-top: 0.25rem; }
.entry { background: #12121a; border: 1px solid #222; border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
.entry-header { padding: 1rem 1.25rem; border-bottom: 1px solid #1a1a24; }
.entry-title { font-weight: 700; color: #e8e8f0; font-size: 1.05rem; }
.entry-date { color: #666; font-size: 0.8rem; margin-top: 0.25rem; }
.entry-body { padding: 1.25rem; }
.entry-body p { margin-bottom: 0.75rem; }
.label { display: inline-block; background: #1a1a2a; color: #a0a0c0; font-size: 0.75rem; font-weight: section-body 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.2rem 0.5rem; border-radius: 4px; margin-bottom: 0.75rem; }
model-viewer { width: 100%; height: 400px; background: #1a1a22; border-radius: 6px; }
img { max-width: 100%; border-radius: 6px; }
.commit-link { color: #60a0f0; font-size: 0.85rem; text-decoration: none; }
.commit-link:hover { text-decoration: underline; }
.empty { text-align: center; padding: 3rem; color: #555; }
</style>
</head>
<body>
<div class="container">
<header>
  <h1>Tumples V23 Avatar — Review Board</h1>
  <div class="subtitle">Reverse-chronological decision log. Each entry links to its commit.</div>
</header>
<div id="entries">
  <div class="empty">Entries incoming — standing by.</div>
</div>
</div>
</body>
</html>
